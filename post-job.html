<!DOCTYPE html>
<html lang="en" data-theme="green" data-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Post a Daily Job - RojgarSetu (Demo)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

  <!-- Top Navigation -->
  <header class="app-navbar">
    <div class="container-fluid px-3 px-md-4">
      <div class="d-flex align-items-center justify-content-between">
        
        <div class="d-flex align-items-center gap-2">
          <a href="contractor-dashboard.html" class="btn btn-sm btn-outline-secondary border-0 p-1 me-1">
            <i class="bi bi-arrow-left fs-5"></i>
          </a>
          <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
            <div class="rounded-3 p-2 d-flex align-items-center justify-content-center" style="background: var(--brand-gradient); color: #fff; width: 38px; height: 38px;">
              <i class="bi bi-tools fs-5"></i>
            </div>
            <div>
              <span class="fw-bold fs-5 d-block lh-1" style="color: var(--text-main);">RojgarSetu</span>
              <small class="text-muted" style="font-size: 0.70rem; font-weight: 600; letter-spacing: 0.5px;">DAILY WAGE PLATFORM</small>
            </div>
          </a>
        </div>

        <div class="d-flex align-items-center gap-2">
          <!-- Palette Toggle -->
          <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-1 border-0" type="button" data-bs-toggle="dropdown">
              <i class="bi bi-palette-fill" style="color: var(--brand-primary);"></i>
              <span class="d-none d-sm-inline small fw-semibold">Theme</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 py-2" style="background-color: var(--bg-surface);">
              <li>
                <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="javascript:void(0)" onclick="DemoTheme.setTheme('green')">
                  <span class="rounded-circle d-inline-block" style="width: 14px; height: 14px; background: #059669;"></span>
                  <span>Emerald Green & White</span>
                </a>
              </li>
              <li>
                <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="javascript:void(0)" onclick="DemoTheme.setTheme('brown')">
                  <span class="rounded-circle d-inline-block" style="width: 14px; height: 14px; background: #92400e;"></span>
                  <span>Warm Earth & Soft Beige</span>
                </a>
              </li>
            </ul>
          </div>

          <button class="btn btn-sm btn-outline-secondary border-0 p-2" type="button" onclick="DemoTheme.toggleMode()" title="Toggle Dark/Light Mode">
            <i class="bi bi-moon-stars-fill" style="color: var(--text-muted);"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="glass-panel p-4 p-md-5">

            <div class="d-flex align-items-center gap-3 mb-4">
              <div class="rounded-3 p-3 text-white" style="background: var(--brand-gradient);">
                <i class="bi bi-briefcase-fill fs-3"></i>
              </div>
              <div>
                <h2 class="fw-bold mb-0" style="color: var(--text-main);">Post a Daily Wage Job</h2>
                <p class="text-muted small mb-0">Broadcast short-term assignments to rated workers in your locality.</p>
              </div>
            </div>

            <!-- Job Post Form (PRD Fields) -->
            <form action="index.html" method="GET">
              <input type="hidden" name="role" value="contractor">
              
              <div class="mb-3">
                <label class="form-label fw-semibold small">Job Title *</label>
                <input type="text" class="form-control" value="Need 2 Experienced Painters for 2BHK Putty Coating" required>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Trade Category *</label>
                  <select class="form-select">
                    <option>Painting & Whitewashing</option>
                    <option>Electrical Work</option>
                    <option>Plumbing</option>
                    <option>Construction & Masonry</option>
                    <option>Housekeeping & Deep Cleaning</option>
                    <option>Carpentry</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Required Skill *</label>
                  <input type="text" class="form-control" value="Wall Putty sanding, Roller finish" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold small">Job Description & Scope *</label>
                <textarea rows="3" class="form-control" required>Interior repainting of walls and ceiling. Scaffolding and ladders provided. Fast daily settlement after work inspection.</textarea>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Daily Wage Offered (₹) *</label>
                  <div class="input-group">
                    <span class="input-group-text bg-transparent border-subtle">₹</span>
                    <input type="number" class="form-control" value="850" required>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Pay Frequency *</label>
                  <select class="form-select">
                    <option>Daily Wage (Paid Every Evening)</option>
                    <option>Fixed Project Lump-Sum</option>
                  </select>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Site Address / Locality *</label>
                  <input type="text" class="form-control" value="Indiranagar 100ft Road, Bengaluru" required>
                </div>
                <div class="col-md-3">
                  <label class="form-label fw-semibold small">Workers Needed *</label>
                  <input type="number" class="form-control" value="2" required>
                </div>
                <div class="col-md-3">
                  <label class="form-label fw-semibold small">Duration *</label>
                  <input type="text" class="form-control" value="2 Days" required>
                </div>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Contact Phone Number *</label>
                  <input type="text" class="form-control" value="9845012345" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Site Supervisor Name</label>
                  <input type="text" class="form-control" value="Rajesh Sharma" required>
                </div>
              </div>

              <div class="d-flex justify-content-end gap-3 pt-3 border-top border-subtle">
                <a href="index.html" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-brand px-4">
                  <i class="bi bi-broadcast me-1"></i> Post Job Now (Demo)
                </button>
              </div>

            </form>

          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
